[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "typedrank"
version = "0.1.1"
description = "Universal typed reranking for RAG, search, agents and arbitrary Python objects."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TypedRank contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reranking", "search", "rag", "agents", "ranking"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Scientific/Engineering :: Artificial Intelligence", "Typing :: Typed"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kashyaprparmar/typedrank"
Repository = "https://github.com/kashyaprparmar/typedrank"
Issues = "https://github.com/kashyaprparmar/typedrank/issues"
Changelog = "https://github.com/kashyaprparmar/typedrank/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
jev = ["httpx>=0.27,<1"]
embeddings = ["sentence-transformers>=3,<7"]
laya = ["laya==0.3.7"]
all = ["httpx>=0.27,<1", "sentence-transformers>=3,<7", "laya==0.3.7"]
dev = ["build>=1.2", "httpx>=0.27,<1", "mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8"]

[dependency-groups]
dev = ["build>=1.2", "httpx>=0.27,<1", "mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/typedrank"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/FINAL_AUDIT.md",
    "/FINAL_AUDIT_RESOLUTION.md",
    "/TYPEDRANK_ARCHITECTURE.md",
    "/MIGRATION_PLAN.md",
    "/benchmarks/*-smoke.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in billable provider contract tests",
    "laya_live: opt-in tests that download and run Laya weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["UP040"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["typedrank"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["httpx", "sentence_transformers", "laya.*"]
ignore_missing_imports = true
